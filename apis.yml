  detail: >-
    TRexBio is a clinical-stage Treg biologics company with no developer program at all —
    trex.bio is a WordPress/WP Engine marketing site, and the only machine-readable things
    on it are stock CMS plumbing: the WordPress core REST API at /wp-json/ (342 routes, all
    of them WordPress and plugin routes), a Yoast-SEO-generated /llms.txt listing news posts
    and careers pages, and an undocumented WordPress MCP adapter at
    /wp-json/mcp/mcp-oauth-server that returns 401 mcp_unauthorized to anonymous tools/list
    — there is no product API, no /openapi.json, no docs host, and github.com/trexbio has
    zero public repositories.
