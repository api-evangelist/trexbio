aid: trexbio
name: TRexBio
description: 'TRexBio, Inc. is a clinical-stage biotechnology company headquartered at 681
  Gateway Blvd in South San Francisco, California, founded in 2018 and seed funded by SV
  Health Investors, that discovers and develops immunoregulatory biologics based on tissue
  regulatory T cell (Treg) biology. Its Deep Biology Platform combines human tissue samples,
  computational biology and immunobiology expertise to map how tissue Tregs behave in disease
  and to identify and characterize novel targets for inflammatory, autoimmune and other
  immune-mediated conditions. Disclosed programs include TRB-061, the CD30 agonist TRB-071,
  TRB-081, and the Lilly-partnered TRB-051, with Phase 1 trials expected to initiate in 2027.
  The company announced an $84 million Series B in November 2024 and closed a further $50
  million financing in January 2026; investors include Eli Lilly and Company, Pfizer Ventures,
  Johnson & Johnson, SV Health Investors and Polaris Partners. TRexBio publishes no developer
  program, API documentation, SDK or machine-readable API contract. trex.bio is a WordPress
  marketing site whose only machine-readable surfaces are the WordPress core REST API, a
  Yoast-generated llms.txt, and an OAuth-protected WordPress MCP adapter endpoint — CMS
  infrastructure rather than a product API.'
